<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>博客评论外链管理器</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <!-- 顶部 Tab -->
  <header class="tabs" id="tabs">
    <button class="tab active" data-tab="collect" data-i18n="tab_collect">收集</button>
    <button class="tab" data-tab="assistant" data-i18n="tab_assistant">助手</button>
    <button class="tab" data-tab="logs" data-i18n="tab_logs">日志</button>
    <button class="tab" data-tab="library" data-i18n="tab_library">资源库</button>
  </header>

  <main id="main">
    <!-- ===== 收集 ===== -->
    <section id="view-collect" class="view active">
      <div class="form-row">
        <label class="field-label" data-i18n="targetDomain">目标域名</label>
        <div class="input-row">
          <input type="text" id="collect-domain" value="sprunki-game.io" placeholder="sprunki-game.io" spellcheck="false" />
          <button id="btn-collect" class="btn btn-primary" data-i18n="startCollect">开始收集</button>
        </div>
        <div class="input-row" style="margin-top:8px">
          <label class="field-label" style="margin:0 8px 0 0" data-i18n="dataSource">数据来源</label>
          <select id="collect-provider">
            <option value="semrush">Semrush</option>
            <option value="ahrefs">Ahrefs</option>
          </select>
          <label class="field-label" style="margin:0 8px 0 16px" data-i18n="pageDelay">翻页间隔(秒)</label>
          <input type="number" id="page-delay-min" min="1" max="60" style="width:64px" />
          <span style="margin:0 4px">–</span>
          <input type="number" id="page-delay-max" min="1" max="60" style="width:64px" />
        </div>
        <div class="input-row" style="margin-top:8px">
          <label class="field-label" style="margin:0 8px 0 0" data-i18n="pageAsFilter">页面 AS ≥</label>
          <input type="number" id="min-ascore" min="0" max="100" style="width:64px" />
          <span class="hint" style="margin-left:8px;align-self:center" data-i18n="pageAsFilterHint">低于该值的来源页面不入库</span>
        </div>
      </div>

      <div class="card status-card" id="collect-card">
        <div class="status-line">
          <span class="dot" id="collect-dot"></span>
          <span id="collect-phase" data-i18n="statusIdle">空闲中，输入域名开始收集</span>
        </div>
        <!-- 已发现外链：单独展示，右侧为导出按钮 -->
        <div class="discovered-hero">
          <span class="num" id="st-discovered">0</span>
          <span class="lbl" data-i18n="stat_discovered">已发现外链</span>
          <button id="btn-export-backlinks" class="btn btn-ghost btn-sm" style="margin-left:auto" data-i18n="exportBacklinks">导出收集数据 (CSV)</button>
        </div>
        <div class="btn-row" style="margin:28px 0 10px; padding-top:12px; border-top:1px solid var(--input)">
          <button id="btn-analyze" class="btn btn-primary btn-sm" data-i18n="startAnalysis">开始分析</button>
        </div>
        <div class="stats" id="collect-stats">
          <div class="stat"><div class="num" id="st-analyzed">0</div><div class="lbl" data-i18n="stat_analyzed">已分析</div></div>
          <div class="stat"><div class="num" id="st-queued">0</div><div class="lbl" data-i18n="stat_queued">队列中</div></div>
          <div class="stat"><div class="num green" id="st-matched">0</div><div class="lbl" data-i18n="stat_matched">博客评论资源</div></div>
        </div>
        <div class="seed-line" id="collect-seeds" hidden></div>
        <div class="hint-line" data-i18n="matchedHint">命中的博客评论资源已存入「资源库」Tab</div>
      </div>
    </section>

    <!-- ===== 助手（发布主操作台：顶部「当前任务」配置 + 对当前激活标签页执行各步骤）===== -->
    <section id="view-assistant" class="view">
      <div class="card" style="margin-top:0">
        <div class="asst-task-head">
          <button id="asst-task-toggle" class="asst-task-toggle" title="展开/收起">▾</button>
          <label class="field-label" style="margin:0" data-i18n="asstTask">当前任务</label>
          <!-- 折叠时在标题行显示当前任务名，便于确认操作对象 -->
          <span class="asst-task-name" id="asst-task-name" hidden></span>
        </div>
        <div class="form-row" style="margin-top:10px">
          <div class="tpl-row">
            <select id="asst-tpl"><option value="" data-i18n="tplSelect">选择模板填充…</option></select>
            <button id="asst-tpl-save" class="btn btn-ghost btn-sm" data-i18n="tplSave">存为模板</button>
            <button id="asst-tpl-del" class="btn btn-ghost btn-sm" data-i18n="delete" disabled>删除</button>
          </div>
        </div>
        <!-- 任务详情：可被右上角按钮折叠/展开 -->
        <div id="asst-task-body">
          <div class="form-row">
            <label class="field-label" data-i18n="taskName">任务名称</label>
            <input type="text" id="at-name" placeholder="Canva" />
          </div>
          <div class="form-row">
            <label class="field-label" data-i18n="targetUrl">目标地址（用于评论正文内嵌链接）</label>
            <input type="text" id="at-url" placeholder="https://www.canva.com/" spellcheck="false" />
          </div>
          <div class="form-row">
            <label class="field-label" data-i18n="siteIntro">网站介绍（一两句，供 AI 生成评论）</label>
            <textarea id="at-intro" rows="2" data-i18n-ph="siteIntroPh"></textarea>
          </div>
          <div class="form-row">
            <label class="field-label" data-i18n="mainKeyword">主关键词（AI 做同义词/前后缀变体作锚文本）</label>
            <input type="text" id="at-keyword" data-i18n-ph="mainKeywordPh" />
          </div>
        </div>
      </div>

      <div class="form-row" style="margin-top:12px">
        <label class="field-label" data-i18n="asstCurrentUrl">当前资源（当前激活标签页）</label>
        <div class="asst-url" id="asst-url"></div>
      </div>
      <button id="asst-next" class="btn btn-outline btn-block" style="margin-top:0" data-i18n="asstNext">换一个（打开未发布资源）</button>
      <button id="asst-locate" class="btn btn-outline btn-block" data-i18n="asstLocate">定位目标链接</button>

      <div class="card status-card">
        <div class="status-line">
          <span class="dot" id="asst-dot"></span>
          <span id="asst-status"></span>
        </div>
        <div class="asst-steps">
          <button class="btn btn-sm asst-step" data-step="summarize" data-i18n="stepSummarize">获取标题与摘要</button>
          <button class="btn btn-sm asst-step" data-step="detectForm" data-i18n="stepDetect">AI 识别评论表单</button>
          <button class="btn btn-sm asst-step" data-step="genComment" data-i18n="stepGen">AI 生成评论</button>
          <button class="btn btn-sm asst-step" data-step="fill" data-i18n="stepFill">自动填写表单</button>
        </div>
        <!-- 摘要区 + 评论字段区：由 renderAssistant 按 snap.publish.manual 动态填充（各带复制按钮） -->
        <div id="asst-fields"></div>
        <div class="btn-row asst-decide">
          <button id="asst-skip" class="btn btn-ghost" data-i18n="asstSkip">Skip</button>
          <button id="asst-submit" class="btn btn-success" data-i18n="asstSubmit">Submit</button>
        </div>
        <!-- 标记无效资源：改 analysis 记录 enabled=false（不删数据） -->
        <button id="asst-disable" class="btn btn-outline btn-block" style="margin-top:6px" data-i18n="asstMarkInvalid">标记为无效资源</button>
        <!-- Submit 成功后显示：给 published 记录补一条备注（comment 字段） -->
        <div class="input-row" id="asst-note-row" hidden style="margin-top:6px">
          <input type="text" id="asst-note" spellcheck="false" />
          <button id="asst-note-save" class="btn btn-sm" data-i18n="asstNoteSave">备注</button>
        </div>
      </div>
    </section>

    <!-- ===== 日志 ===== -->
    <section id="view-logs" class="view">
      <div class="row-between">
        <div class="log-title-row">
          <h2 class="section-title" data-i18n="logsTitle">运行日志</h2>
          <label class="log-switch" data-i18n-title="logSwitchTitle" title="开启后记录运行日志，关闭则直接丢弃">
            <input type="checkbox" id="log-enabled" checked />
            <span class="slider"></span>
            <span class="log-switch-label" data-i18n="logSwitch">记录日志</span>
          </label>
        </div>
        <div style="display:flex;gap:6px">
          <button id="btn-copy-logs" class="btn btn-ghost btn-sm" data-i18n="copyLogs">一键复制</button>
          <button id="btn-clear-logs" class="btn btn-ghost btn-sm" data-i18n="clearLogs">清空日志</button>
        </div>
      </div>
      <div id="log-list" class="log-list"></div>
      <div class="empty" id="logs-empty" data-i18n="noLogs">暂无日志</div>
    </section>

    <!-- ===== 资源库 ===== -->
    <section id="view-library" class="view">
      <div class="chips" id="type-chips">
        <button class="chip active" data-type="all" data-i18n="filterAll">全部</button>
        <button class="chip" data-type="blog_comment" data-i18n="type_blog_comment">博客评论</button>
        <button class="chip" data-type="profile" data-i18n="type_profile">个人主页</button>
      </div>
      <div class="chips" id="status-chips">
        <button class="chip" data-status="ready" data-i18n="st_ready">可发布</button>
        <button class="chip" data-status="published" data-i18n="st_published">已发布</button>
        <button class="chip" data-status="failed" data-i18n="st_failed">失败</button>
        <button class="chip" data-status="captcha" data-i18n="st_captcha">有验证码</button>
      </div>
      <div class="count-row">
        <div class="count-line" id="res-count">共 0 条资源</div>
        <input type="checkbox" id="res-toggle-all" data-i18n-title="resToggleAll" title="启用全部 / 停用全部">
      </div>
      <div id="res-list" class="res-list"></div>
      <div class="empty" id="res-empty" data-i18n="noResources">暂无资源</div>
      <button id="btn-export-csv" class="btn btn-outline btn-block" data-i18n="exportCSV">导出 CSV</button>
    </section>
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <button id="btn-settings" class="footer-link" data-i18n="settings">设置</button>
    <span class="sep">|</span>
    <button id="btn-clear-data" class="footer-link danger" data-i18n="clearData">清空数据</button>
    <span class="sep">|</span>
    <button id="btn-reload" class="footer-link" data-i18n="devReloadShort" data-i18n-title="devReload">重载插件</button>
    <span class="spacer"></span>
    <select id="lang-select">
      <option value="zh">中文</option>
      <option value="en">English</option>
    </select>
  </footer>

  <div id="toast" hidden></div>

  <script type="module" src="panel.js"></script>
</body>
</html>
